<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potentiometer Reader</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --border-color: #334155;
      --accent: #8b5cf6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 450px;
      text-align: center;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    h2 {
      margin-top: 0;
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      color: var(--text-color);
    }

    .status-badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 2rem;
      background-color: var(--border-color);
      color: #94a3b8;
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      background-color: rgba(34, 197, 94, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
    }

    .btn {
      width: 100%;
      padding: 0.875rem;
      border-radius: 10px;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 1.5rem;
      transition: all 0.2s ease-in-out;
    }

    .btn-connect {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
    }

    .btn-connect:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(59, 130, 246, 0.4);
    }

    .btn-disconnect {
      background-color: var(--danger);
      color: white;
    }

    .btn-disconnect:hover {
      background-color: #dc2626;
      transform: translateY(-2px);
    }

    .value-display {
      background-color: rgba(15, 23, 42, 0.6);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      margin-top: 1rem;
    }

    .value-label {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .value-number {
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
      line-height: 1;
    }
    
    .progress-bar-container {
      width: 100%;
      height: 12px;
      background-color: #334155;
      border-radius: 6px;
      margin-top: 1.5rem;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0%;
      transition: width 0.1s ease-out;
    }

  </style>
</head>
<body>

  <div class="card">
    <h2>Potentiometer Serial</h2>
    <div id="status" class="status-badge">Disconnected</div>

    <button id="btnConnect" class="btn btn-connect">Select Port & Connect</button>

    <div class="value-display">
      <div class="value-label">Potentiometer Value</div>
      <div id="potValue" class="value-number">000</div>
      <div class="progress-bar-container">
        <div id="potBar" class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    let port;
    let reader;
    let inputDone;
    let keepReading = false;

    const btnConnect = document.getElementById('btnConnect');
    const statusDiv = document.getElementById('status');
    const potValueDisplay = document.getElementById('potValue');
    const potBarDisplay = document.getElementById('potBar');

    // Check for Web Serial support
    if (!("serial" in navigator)) {
      alert("Web Serial API is not supported in this browser. Please use Chrome or Edge.");
    }

    btnConnect.addEventListener('click', async () => {
      if (port) {
        // Disconnect logic
        keepReading = false;
        if (reader) {
          await reader.cancel();
        }
        await inputDone.catch(() => {});
        await port.close();
        port = null;
        
        statusDiv.textContent = "Disconnected";
        statusDiv.classList.remove('connected');
        btnConnect.textContent = "Select Port & Connect";
        btnConnect.classList.remove('btn-disconnect');
        btnConnect.classList.add('btn-connect');
        potValueDisplay.textContent = "000";
        potBarDisplay.style.width = "0%";
        return;
      }

      try {
        // Prompt user to select port
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });

        statusDiv.textContent = "Connected (9600 baud)";
        statusDiv.classList.add('connected');
        btnConnect.textContent = "Disconnect";
        btnConnect.classList.remove('btn-connect');
        btnConnect.classList.add('btn-disconnect');

        keepReading = true;
        readLoop();

      } catch (err) {
        console.error("Serial error:", err);
        alert("Failed to connect: " + err.message);
      }
    });

    async function readLoop() {
      const decoder = new TextDecoderStream();
      inputDone = port.readable.pipeTo(decoder.writable);
      const inputStream = decoder.readable;

      reader = inputStream.getReader();
      
      let buffer = "";

      try {
        while (keepReading) {
          const { value, done } = await reader.read();
          if (done) {
            // reader has been canceled.
            break;
          }
          if (value) {
            buffer += value;
            let lines = buffer.split('\n');
            // Keep the last partial line in the buffer
            buffer = lines.pop(); 
            
            // Process all complete lines
            for (let line of lines) {
              line = line.trim();
              if (line) {
                updateValue(line);
              }
            }
          }
        }
      } catch (error) {
        console.error("Read error:", error);
      } finally {
        reader.releaseLock();
      }
    }

    function updateValue(valueStr) {
      const val = parseInt(valueStr, 10);
      if (!isNaN(val)) {
        // Pad with zeros for aesthetic (e.g. 045 instead of 45, max is 1023)
        potValueDisplay.textContent = val.toString().padStart(3, '0');
        
        // Calculate percentage for progress bar (0-1023 mapping to 0-100%)
        const percentage = Math.min(100, Math.max(0, (val / 1023) * 100));
        potBarDisplay.style.width = `${percentage}%`;
      }
    }
  </script>
</body>
</html>
